<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Network Exporter</title>
    <link rel="stylesheet" href="panel.css">
  </head>
  <body>
    <main class="app">
      <section class="toolbar" data-i18n-aria="toolbar_aria">
        <button id="recordToggle" class="icon-button active" type="button" data-i18n-title="record_title" data-i18n-aria="record_title">
          <span class="record-dot"></span>
        </button>
        <button id="clearRequests" class="icon-button" type="button" data-i18n-title="clear_title" data-i18n-aria="clear_title">
          <span class="clear-icon"></span>
        </button>
        <button id="filterToggle" class="icon-button active" type="button" data-i18n-title="filter_title" data-i18n-aria="filter_title">
          <span class="filter-icon"></span>
        </button>
        <label class="search-box">
          <span class="search-icon"></span>
          <input id="filterInput" type="search" data-i18n-placeholder="filter_placeholder">
        </label>
        <label class="check-control">
          <input id="preserveLog" type="checkbox">
          <span data-i18n="preserve_log">Preserve log</span>
        </label>
        <label class="check-control">
          <input id="invertFilter" type="checkbox">
          <span data-i18n="invert">Invert</span>
        </label>
        <label class="check-control">
          <input id="excludeExtensionRequests" type="checkbox" checked>
          <span data-i18n="exclude_extensions">Exclude extensions</span>
        </label>
        <select id="statusFilter" class="select-control" data-i18n-aria="status_filter_aria">
          <option value="" data-i18n="status_any">Any status</option>
          <option value="2">2xx</option>
          <option value="3">3xx</option>
          <option value="4">4xx</option>
          <option value="5">5xx</option>
          <option value="failed" data-i18n="status_failed">Failed</option>
          <option value="errors" data-i18n="status_errors">Errors</option>
        </select>
      </section>

      <section id="filterPanel" class="filters" data-i18n-aria="filters_aria">
        <div id="typeChips" class="chips" role="listbox" data-i18n-aria="type_aria">
          <button class="chip active" type="button" data-type="all" data-i18n="type_all">All</button>
          <button class="chip" type="button" data-type="fetch-xhr" data-i18n="type_fetch_xhr">Fetch/XHR</button>
          <button class="chip" type="button" data-type="doc" data-i18n="type_doc">Doc</button>
          <button class="chip" type="button" data-type="css" data-i18n="type_css">CSS</button>
          <button class="chip" type="button" data-type="js" data-i18n="type_js">JS</button>
          <button class="chip" type="button" data-type="font" data-i18n="type_font">Font</button>
          <button class="chip" type="button" data-type="img" data-i18n="type_img">Img</button>
          <button class="chip" type="button" data-type="media" data-i18n="type_media">Media</button>
          <button class="chip" type="button" data-type="manifest" data-i18n="type_manifest">Manifest</button>
          <button class="chip" type="button" data-type="socket" data-i18n="type_socket">Socket</button>
          <button class="chip" type="button" data-type="wasm" data-i18n="type_wasm">Wasm</button>
          <button class="chip" type="button" data-type="other" data-i18n="type_other">Other</button>
        </div>
      </section>

      <section id="content" class="content">
        <section class="request-pane" data-i18n-aria="request_pane_aria">
          <div class="table-meta">
            <span id="requestCount">0 requests</span>
            <span id="statusSummary" class="status-summary" data-i18n-aria="status_summary_aria"></span>
            <span id="selectedCount">0 selected</span>
          </div>
          <div class="table-wrap">
            <table>
              <colgroup>
                <col class="col-select">
                <col class="col-name">
                <col class="col-method">
                <col class="col-status">
                <col class="col-type">
                <col class="col-size">
                <col class="col-time">
                <col class="col-initiator">
                <col class="col-url">
              </colgroup>
              <thead>
                <tr>
                  <th class="select-col">
                    <input id="selectAll" type="checkbox" data-i18n-aria="select_all_aria">
                  </th>
                  <th data-i18n="th_name">Name</th>
                  <th data-i18n="th_method">Method</th>
                  <th data-i18n="th_status">Status</th>
                  <th data-i18n="th_type">Type</th>
                  <th data-i18n="th_size">Size</th>
                  <th data-i18n="th_time">Time</th>
                  <th data-i18n="th_initiator">Initiator</th>
                  <th data-i18n="th_url">URL</th>
                </tr>
              </thead>
              <tbody id="requestRows"></tbody>
            </table>
          </div>
          <section class="detail-pane" data-i18n-aria="detail_pane_aria">
            <div class="detail-header">
              <div class="detail-title">
                <strong id="detailName">No request selected</strong>
                <span id="detailUrl"></span>
              </div>
              <div id="detailTabs" class="detail-tabs" role="tablist" data-i18n-aria="detail_tabs_aria">
                <button class="detail-tab active" type="button" data-detail-tab="headers" data-i18n="tab_headers">Headers</button>
                <button class="detail-tab" type="button" data-detail-tab="payload" data-i18n="tab_payload">Payload</button>
                <button class="detail-tab" type="button" data-detail-tab="response" data-i18n="tab_response">Response</button>
                <button class="detail-tab" type="button" data-detail-tab="meta" data-i18n="tab_meta">Meta</button>
              </div>
            </div>
            <pre id="detailContent" class="detail-content">Click a request row to inspect it.</pre>
          </section>
        </section>

        <aside id="exportPane" class="export-pane" data-i18n-aria="export_aria">
          <div class="export-header">
            <h1 data-i18n="export_title">Export</h1>
            <div class="export-header-actions">
              <div class="preset-actions">
                <button id="selectDefaults" type="button" data-i18n="preset_defaults">Defaults</button>
                <button id="selectFullFields" type="button" data-i18n="preset_full">Full</button>
              </div>
              <button id="toggleExportPane" class="icon-button export-toggle" type="button" data-i18n-title="export_collapse" data-i18n-aria="export_collapse">
                <span class="collapse-icon"></span>
              </button>
            </div>
          </div>

          <div id="exportBody" class="export-body">
                        <fieldset id="fieldList" class="field-list">
              <legend data-i18n="fields_legend">Fields</legend>
              <div class="field-chip" data-field-name="curlRequest">
                <button type="button" class="field-move" data-move="up" data-field-name="curlRequest" data-i18n-title="field_move_up" data-i18n-aria="field_move_up">&#8592;</button>
                <span class="field-order-badge" aria-hidden="true"></span>
                <label><input type="checkbox" data-field="curlRequest" checked> curlRequest</label>
                <button type="button" class="field-move" data-move="down" data-field-name="curlRequest" data-i18n-title="field_move_down" data-i18n-aria="field_move_down">&#8594;</button>
              </div>
              <div class="field-chip" data-field-name="statusCode">
                <button type="button" class="field-move" data-move="up" data-field-name="statusCode" data-i18n-title="field_move_up" data-i18n-aria="field_move_up">&#8592;</button>
                <span class="field-order-badge" aria-hidden="true"></span>
                <label><input type="checkbox" data-field="statusCode" checked> statusCode</label>
                <button type="button" class="field-move" data-move="down" data-field-name="statusCode" data-i18n-title="field_move_down" data-i18n-aria="field_move_down">&#8594;</button>
              </div>
              <div class="field-chip" data-field-name="responseBody">
                <button type="button" class="field-move" data-move="up" data-field-name="responseBody" data-i18n-title="field_move_up" data-i18n-aria="field_move_up">&#8592;</button>
                <span class="field-order-badge" aria-hidden="true"></span>
                <label><input type="checkbox" data-field="responseBody" checked> responseBody</label>
                <button type="button" class="field-move" data-move="down" data-field-name="responseBody" data-i18n-title="field_move_down" data-i18n-aria="field_move_down">&#8594;</button>
              </div>
              <div class="field-chip" data-field-name="method">
                <button type="button" class="field-move" data-move="up" data-field-name="method" data-i18n-title="field_move_up" data-i18n-aria="field_move_up">&#8592;</button>
                <span class="field-order-badge" aria-hidden="true"></span>
                <label><input type="checkbox" data-field="method" checked> method</label>
                <button type="button" class="field-move" data-move="down" data-field-name="method" data-i18n-title="field_move_down" data-i18n-aria="field_move_down">&#8594;</button>
              </div>
              <div class="field-chip" data-field-name="url">
                <button type="button" class="field-move" data-move="up" data-field-name="url" data-i18n-title="field_move_up" data-i18n-aria="field_move_up">&#8592;</button>
                <span class="field-order-badge" aria-hidden="true"></span>
                <label><input type="checkbox" data-field="url"> url</label>
                <button type="button" class="field-move" data-move="down" data-field-name="url" data-i18n-title="field_move_down" data-i18n-aria="field_move_down">&#8594;</button>
              </div>
              <div class="field-chip" data-field-name="name">
                <button type="button" class="field-move" data-move="up" data-field-name="name" data-i18n-title="field_move_up" data-i18n-aria="field_move_up">&#8592;</button>
                <span class="field-order-badge" aria-hidden="true"></span>
                <label><input type="checkbox" data-field="name"> name</label>
                <button type="button" class="field-move" data-move="down" data-field-name="name" data-i18n-title="field_move_down" data-i18n-aria="field_move_down">&#8594;</button>
              </div>
              <div class="field-chip" data-field-name="type">
                <button type="button" class="field-move" data-move="up" data-field-name="type" data-i18n-title="field_move_up" data-i18n-aria="field_move_up">&#8592;</button>
                <span class="field-order-badge" aria-hidden="true"></span>
                <label><input type="checkbox" data-field="type"> type</label>
                <button type="button" class="field-move" data-move="down" data-field-name="type" data-i18n-title="field_move_down" data-i18n-aria="field_move_down">&#8594;</button>
              </div>
              <div class="field-chip" data-field-name="size">
                <button type="button" class="field-move" data-move="up" data-field-name="size" data-i18n-title="field_move_up" data-i18n-aria="field_move_up">&#8592;</button>
                <span class="field-order-badge" aria-hidden="true"></span>
                <label><input type="checkbox" data-field="size"> size</label>
                <button type="button" class="field-move" data-move="down" data-field-name="size" data-i18n-title="field_move_down" data-i18n-aria="field_move_down">&#8594;</button>
              </div>
              <div class="field-chip" data-field-name="time">
                <button type="button" class="field-move" data-move="up" data-field-name="time" data-i18n-title="field_move_up" data-i18n-aria="field_move_up">&#8592;</button>
                <span class="field-order-badge" aria-hidden="true"></span>
                <label><input type="checkbox" data-field="time"> time</label>
                <button type="button" class="field-move" data-move="down" data-field-name="time" data-i18n-title="field_move_down" data-i18n-aria="field_move_down">&#8594;</button>
              </div>
              <div class="field-chip" data-field-name="initiator">
                <button type="button" class="field-move" data-move="up" data-field-name="initiator" data-i18n-title="field_move_up" data-i18n-aria="field_move_up">&#8592;</button>
                <span class="field-order-badge" aria-hidden="true"></span>
                <label><input type="checkbox" data-field="initiator"> initiator</label>
                <button type="button" class="field-move" data-move="down" data-field-name="initiator" data-i18n-title="field_move_down" data-i18n-aria="field_move_down">&#8594;</button>
              </div>
              <div class="field-chip" data-field-name="requestHeaders">
                <button type="button" class="field-move" data-move="up" data-field-name="requestHeaders" data-i18n-title="field_move_up" data-i18n-aria="field_move_up">&#8592;</button>
                <span class="field-order-badge" aria-hidden="true"></span>
                <label><input type="checkbox" data-field="requestHeaders"> requestHeaders</label>
                <button type="button" class="field-move" data-move="down" data-field-name="requestHeaders" data-i18n-title="field_move_down" data-i18n-aria="field_move_down">&#8594;</button>
              </div>
              <div class="field-chip" data-field-name="requestBody">
                <button type="button" class="field-move" data-move="up" data-field-name="requestBody" data-i18n-title="field_move_up" data-i18n-aria="field_move_up">&#8592;</button>
                <span class="field-order-badge" aria-hidden="true"></span>
                <label><input type="checkbox" data-field="requestBody"> requestBody</label>
                <button type="button" class="field-move" data-move="down" data-field-name="requestBody" data-i18n-title="field_move_down" data-i18n-aria="field_move_down">&#8594;</button>
              </div>
              <div class="field-chip" data-field-name="responseHeaders">
                <button type="button" class="field-move" data-move="up" data-field-name="responseHeaders" data-i18n-title="field_move_up" data-i18n-aria="field_move_up">&#8592;</button>
                <span class="field-order-badge" aria-hidden="true"></span>
                <label><input type="checkbox" data-field="responseHeaders"> responseHeaders</label>
                <button type="button" class="field-move" data-move="down" data-field-name="responseHeaders" data-i18n-title="field_move_down" data-i18n-aria="field_move_down">&#8594;</button>
              </div>
              <div class="field-chip" data-field-name="mimeType">
                <button type="button" class="field-move" data-move="up" data-field-name="mimeType" data-i18n-title="field_move_up" data-i18n-aria="field_move_up">&#8592;</button>
                <span class="field-order-badge" aria-hidden="true"></span>
                <label><input type="checkbox" data-field="mimeType"> mimeType</label>
                <button type="button" class="field-move" data-move="down" data-field-name="mimeType" data-i18n-title="field_move_down" data-i18n-aria="field_move_down">&#8594;</button>
              </div>
            </fieldset>

            <label class="check-control sensitive">
              <input id="includeSensitiveHeaders" type="checkbox">
              <span data-i18n="include_sensitive">Include sensitive headers</span>
            </label>

            <label class="check-control">
              <input id="truncateLargeBodies" type="checkbox" checked>
              <span data-i18n="truncate_bodies">Truncate large bodies (256&nbsp;kB)</span>
            </label>

            <div class="export-actions">
              <button id="copyJson" type="button" data-i18n="copy_json">Copy selected as JSON</button>
              <button id="copyMarkdown" type="button" data-i18n="copy_markdown">Copy selected as Markdown</button>
            </div>
            <p id="statusMessage" class="status-message" role="status"></p>
          </div>
        </aside>
      </section>
    </main>

    <script src="shared.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
